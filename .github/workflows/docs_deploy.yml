name: Deploy Documentation

on:
  push:
    branches:
      - main

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Run a one-line script
      run: echo "The job was automatically triggered by a ${{ github.event_name }} event."

    - name: checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: TEST
        init-shell: bash
        create-args: >-
          python=3.12 pip
          --file requirements-dev.txt
          --channel conda-forge

    - name: Install caldip
      shell: bash -l {0}
      run: |
        pip install --only-binary=matplotlib -e .

    - name: Build documentation
      shell: bash -l {0}
      run: |
        set -e
        # jupyter nbconvert --to notebook --execute notebooks/demo.ipynb --output=demo-output.ipynb --ExecutePreprocessor.allow_errors=False
        # mv notebooks/*output.ipynb docs/source/
        pushd docs
        make clean && make html
        popd

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/build/html
        # Replace gh-pages with a single commit each deploy. The built site is
        # regenerable, so its history has no value. The saving is smaller than it
        # looks: git deltas near-identical HTML well, and squashing 70-120 deploys
        # shrinks a fresh clone by only 4-18%. What it does bound is the growth from
        # re-executed demo notebooks, whose embedded PNGs differ every build and so
        # never delta. Current site size dominates, not history - keep _static small.
        force_orphan: true
