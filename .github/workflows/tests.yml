name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '**.ipynb'
      - '**.rst'
      - '**.md'
      - 'pyproject.toml'
      - '.github/workflows/**'

jobs:
  test:
    name: ${{ matrix.os }} / Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # Ubuntu covers the full Python range; macOS and Windows run one version
        # only — they catch platform issues, not version issues.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[test]"

      - name: Test with pytest
        # Coverage is measured on one cell (ubuntu / 3.12) so the floor is compared
        # against one platform's number; every other cell runs --no-cov.
        # Raise the floor as coverage grows; never lower it.
        run: |
          pytest -q \
          ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') && '--cov=caldip --cov-report=term-missing --cov-fail-under=52' || '--no-cov' }}
